<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#E34234" />

		<!-- Canonical URL -->
		<link rel="canonical" href="https://ketchup.yamanlabs.com/" />

		<!-- Icon -->
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- SSO -->
		<meta property="og:title" content="Ketchup - Pomodoro Focus Timer" />
		<meta property="og:description" content="A simple Pomodoro timer. Pop out the timer into a Picture-in-Picture window to have your timer always visible while you work." />
		<meta property="og:image" content="/ketchup-og.png" />
		<meta property="og:url" content="https://ketchup.yamanlabs.com" />
		<meta property="og:type" content="website" />

		<!-- X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Ketchup - Pomodoro Focus Timer" />
		<meta name="twitter:description" content="A simple Pomodoro timer. Pop out the timer into a Picture-in-Picture window to have your timer always visible while you work." />
		<meta name="twitter:image" content="/ketchup-og.png" />
		

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
